{% extends "base.html" %}
{% block content %}
<h2>Student Records</h2>
<form method="POST">
    <input name="student_id" placeholder="Student ID" required>
    <input name="full_name" placeholder="Full Name" required>
    <input name="class_name" placeholder="Class (e.g. SHS 2A)" required>
    <select name="gender">
        <option>Male</option><option>Female</option>
    </select>
    <input name="guardian_phone" placeholder="Guardian Phone">
    <button type="submit">Add Student</button>
</form>

<table>
    <tr><th>Student ID</th><th>Name</th><th>Class</th><th>Gender</th><th>Guardian Phone</th></tr>
    {% for s in students %}
    <tr>
        <td>{{ s[1] }}</td><td>{{ s[2] }}</td><td>{{ s[3] }}</td><td>{{ s[4] }}</td><td>{{ s[5] }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
